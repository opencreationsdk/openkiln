[platformio]
default_envs = esp32dev

[env:esp32dev]
; Pinned to the Arduino-ESP32 2.0.x line (ESP-IDF 4.4) for reproducible builds.
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Gzips web/*.html|css|js into include/WebAssets.h before every build.
extra_scripts = pre:tools/embed_web.py
build_flags =
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  knolleary/PubSubClient @ ^2.8
