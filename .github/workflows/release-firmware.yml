name: Build and Release OpenKiln Firmware

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - ".github/workflows/release-firmware.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Release
    runs-on: ubuntu-24.04

    steps:
      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # Read OpenKiln version
      # Version is stored in:
      # include/Version.h
      #
      # Example:
      # #define OPENKILN_VERSION "1.0.2"
      # -------------------------------------------------------
      - name: Read firmware version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^#define[[:space:]]\+OPENKILN_VERSION[[:space:]]\+"\([^"]*\)".*/\1/p' include/Version.h | head -n1)

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not find OPENKILN_VERSION in include/Version.h"
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid version: $VERSION"
            echo "Expected format: X.Y.Z"
            exit 1
          fi

          echo "OpenKiln firmware version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------
      # Check whether this version already exists
      # -------------------------------------------------------
      - name: Check if release already exists
        id: release_check
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # -------------------------------------------------------
      # Python
      # -------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # -------------------------------------------------------
      # PlatformIO
      # -------------------------------------------------------
      - name: Install PlatformIO
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # -------------------------------------------------------
      # Build firmware
      # -------------------------------------------------------
      - name: Build OpenKiln firmware
        shell: bash
        run: |
          pio run -e esp32dev

      # -------------------------------------------------------
      # Verify firmware.bin
      # -------------------------------------------------------
      - name: Verify firmware
        shell: bash
        run: |
          FIRMWARE=".pio/build/esp32dev/firmware.bin"

          if [ ! -f "$FIRMWARE" ]; then
            echo "ERROR: firmware.bin was not generated."
            echo ""
            echo "Contents of .pio/build:"
            find .pio/build -type f || true
            exit 1
          fi

          echo "Firmware successfully built:"
          ls -lh "$FIRMWARE"

      # -------------------------------------------------------
      # Copy firmware to release directory
      # -------------------------------------------------------
      - name: Prepare release firmware
        shell: bash
        run: |
          mkdir -p release

          cp \
            .pio/build/esp32dev/firmware.bin \
            release/firmware.bin

          echo "Release asset:"
          ls -lh release/firmware.bin

      # -------------------------------------------------------
      # Upload as workflow artifact
      # Useful even if release already exists
      # -------------------------------------------------------
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openkiln-${{ steps.version.outputs.version }}
          path: release/firmware.bin
          if-no-files-found: error

      # -------------------------------------------------------
      # Create GitHub Release
      #
      # This step only runs when the version/tag does NOT
      # already exist.
      # -------------------------------------------------------
      - name: Create GitHub Release
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" \
            release/firmware.bin \
            --target "${{ github.sha }}" \
            --title "OpenKiln v$VERSION" \
            --notes "OpenKiln firmware v$VERSION" \
            --latest

      # -------------------------------------------------------
      # Final information
      # -------------------------------------------------------
      - name: Release information
        shell: bash
        run: |
          echo "---------------------------------------"
          echo "OpenKiln Firmware"
          echo "---------------------------------------"
          echo "Version : ${{ steps.version.outputs.version }}"
          echo "Tag     : ${{ steps.version.outputs.tag }}"
          echo "Asset   : firmware.bin"
          echo "---------------------------------------"

          if [ "${{ steps.release_check.outputs.exists }}" = "true" ]; then
            echo "Release already existed - no new release created."
          else
            echo "New release created successfully."
          fi
